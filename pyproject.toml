[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openmedic"
version = "0.1.0"
description = "Open-source, local-first CI/CD failure diagnosis and safe recovery assistant."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "OpenMedic contributors" }]
keywords = ["ci", "cd", "github-actions", "diagnosis", "remediation", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]
# License: MIT, chosen by the project owner. The root LICENSE file is authoritative and
# is shipped in the wheel/sdist metadata (PEP 639 SPDX expression, supported by the
# hatchling build backend). The deprecated `License :: OSI Approved :: ...` classifiers
# are intentionally omitted: with a License-Expression they are redundant and PEP 639
# marks them as deprecated.
license = "MIT"
license-files = ["LICENSE"]

dependencies = [
  "typer>=0.12",
  "pydantic>=2.6",
  "httpx>=0.27",
]

[project.optional-dependencies]
# Optional interface layer. CLI-only installs must never require these.
api = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[project.scripts]
openmedic = "openmedic.cli.app:run"

[project.urls]
Documentation = "https://github.com/openmedic/openmedic/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/openmedic"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "integration: exercises multiple layers end to end (no network)",
  "safety: security and safety invariant tests",
  "docker: requires Docker and is skipped when unavailable",
]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "S", "ANN", "D", "TRY", "EM", "PIE", "RET", "ARG"]
ignore = [
  "D100",  # missing module docstring (enforced by review, not lint)
  "D104",  # missing package docstring
  "D105",  # missing magic method docstring
  "D107",  # missing __init__ docstring
  "ANN401", # dynamically typed expressions (Any) needed for JSON payloads
  "TRY003", # long messages outside exception class
  "EM102",  # f-string in exception
  "S101",   # assert used in tests... (guarded below by per-file overrides)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN201", "ANN001", "D100", "D101", "D102", "D103", "D104", "ARG001", "ARG002", "PLR2004"]
# Starlette passes the request positionally, and FastAPI handlers are allowed to ignore it.
"src/openmedic/api/**" = ["ANN401", "ARG001"]
# Every rule implements the shared `match(event, lines)` signature; several rules decide
# purely from the log lines and have no use for the event.
# Synthetic CI logs are quoted verbatim in this file, long lines and all.
"tests/diagnosis/test_rule_boundaries.py" = ["E501"]
"src/openmedic/diagnosis/rules.py" = ["ARG002"]
